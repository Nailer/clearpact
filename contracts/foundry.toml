[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
# Arc testnet — chain ID 5042002, native gas token is USDC (18 decimals)
arc_testnet = "https://rpc.testnet.arc.network"

[etherscan]
# ArcScan explorer for contract verification
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
